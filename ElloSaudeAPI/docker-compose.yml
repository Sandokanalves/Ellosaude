version: '3.8'

services:
  # Banco de Dados SQL Server
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ElloSaude_SQL
    ports:
      - "1433:1433"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=SuaSenhaForte123!
    networks:
      - ellosaude-network

  # RabbitMQ com Painel de Gerenciamento
  rabbitmq:
    image: rabbitmq:3-management
    container_name: ElloSaude_RabbitMQ
    ports:
      - "5672:5672"   # Porta para a API
      - "15672:15672" # Porta para o Navegador (Painel)
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    networks:
      - ellosaude-network

  # Backend API (.NET 9)
  api:
    build:
      context: .
      dockerfile: ElloSaude.Api/Dockerfile
    container_name: ElloSaude_API
    ports:
      - "5080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=ElloSaudeDb;User Id=sa;Password=SuaSenhaForte123!;TrustServerCertificate=True;
      - RabbitMq__Host=rabbitmq
      - RabbitMq__Port=5672
      - RabbitMq__UserName=guest
      - RabbitMq__Password=guest
      - Jwt__Key=Chave_Super_Secreta_Com_Pelo_Menos_32_Caracteres
    depends_on:
      - sqlserver
      - rabbitmq
    networks:
      - ellosaude-network

networks:
  ellosaude-network:
    driver: bridge