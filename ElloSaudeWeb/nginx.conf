map $args $redacted_args {
    ~*access_token= "access_token=[REDACTED]";
    default $args;
}

log_format ellosaude_redacted '$remote_addr - $remote_user [$time_local] "$request_method $uri$is_args$redacted_args $server_protocol" $status $body_bytes_sent "$http_referer" "$http_user_agent"';

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    access_log /var/log/nginx/access.log ellosaude_redacted;

    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /hubs/ {
        proxy_pass http://api:8080/hubs/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    location /swagger/ {
        proxy_pass http://api:8080/swagger/;
        proxy_set_header Host $host;
    }

    location = /health {
        proxy_pass http://api:8080/health/ready;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
